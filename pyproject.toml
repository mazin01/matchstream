[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matchstream"
version = "0.1.0"
description = "Reconcile two tables by key, or by amount + date, on DuckDB. Arabic-safe keys and amounts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2",
    "nuqta @ git+https://github.com/mazin01/nuqta",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
test = ["pytest>=8", "pyarrow>=15"]

[project.scripts]
matchstream = "matchstream.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["matchstream"]
